name: 'Prepare Build Environment'
description: 'Prepares build environment with version variables and build metadata'
inputs:
  version-suffix:
    description: 'Version suffix (empty, "-dev", or "-beta")'
    required: false
    default: ''
  node-version:
    description: 'Node.js version to use'
    required: true
  build-number:
    description: 'Build number'
    required: true
  ghcr-org:
    description: 'GHCR organization (lowercase)'
    required: true

outputs:
  version:
    description: 'Image version'
    value: ${{ steps.set-vars.outputs.version }}
  majorversion:
    description: 'Major version with latest- prefix'
    value: ${{ steps.set-vars.outputs.majorversion }}

runs:
  using: 'composite'
  steps:
    - name: Set job variables
      id: set-vars
      shell: bash
      run: |
        VERSION="$(cat .VERSION)"
        MAJORVERSION="latest-$(cat .VERSION | grep -oP '^v\d+')"
        BUILD="${{ inputs.build-number }}"
        
        echo "[LOG] Node.js Version: ${{ inputs.node-version }}"
        echo "[LOG] Image Version: ${VERSION}${{ inputs.version-suffix }}"
        echo "version=${VERSION}" >> $GITHUB_ENV
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "[LOG] Major Image Version: $MAJORVERSION"
        echo "majorversion=$MAJORVERSION" >> $GITHUB_ENV
        echo "majorversion=$MAJORVERSION" >> $GITHUB_OUTPUT
        echo "[LOG] Buildnumber: $BUILD"
        echo "build=$BUILD" >> $GITHUB_ENV
        echo "[LOG] GHCR Org: ${{ inputs.ghcr-org }}"
        echo "ghcr_org=${{ inputs.ghcr-org }}" >> $GITHUB_ENV

    - name: Build metadata ready
      shell: bash
      run: |
        VERSION="$(cat .VERSION)"
        BUILD="${{ inputs.build-number }}"
        echo "[LOG] Build metadata prepared for build args"
        echo "[LOG] Version: ${VERSION}${{ inputs.version-suffix }}"
        echo "[LOG] Build: $BUILD"
        echo "[LOG] Node: ${{ inputs.node-version }}"
