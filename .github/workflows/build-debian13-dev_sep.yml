# Github action to build Debian13 image (Tag: dev)
name: Build Debian 13 Image (dev)

on:
  workflow_dispatch:

jobs:
  create-build-number:
    name: Create build number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.generate-build-number.outputs.build_number }}
      version: ${{ steps.read-version.outputs.version }}
      majorversion: ${{ steps.read-version.outputs.majorversion }}
      ghcr_org: ${{ steps.lowercase-ghcr.outputs.org }}
    steps:
      - name: Checkout repo (main branch)
        uses: actions/checkout@v6.0.1
        with:
          repository: '${{ vars.REPO_OWNER }}/${{ vars.REPO_NAME }}'
          ref: main

      - name: Read version and prepare outputs
        id: read-version
        run: |
          START_TIME=$(date +%s)
          VERSION="$(cat .VERSION)"
          MAJORVERSION="$(cat .VERSION | cut -c 1-3 | sed -r 's#^(.{0})#\1latest-#')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "majorversion=$MAJORVERSION" >> $GITHUB_OUTPUT
          echo "[LOG] Version: $VERSION-dev"
          echo "[LOG] Major Version: $MAJORVERSION"
          echo "[TIMING] Read version: $(($(date +%s) - START_TIME))s"

      - name: Convert GHCR_ORG to lowercase
        id: lowercase-ghcr
        run: |
          GHCR_ORG_LOWER="$(echo '${{ vars.GHCR_ORG }}' | tr '[:upper:]' '[:lower:]')"
          echo "org=$GHCR_ORG_LOWER" >> $GITHUB_OUTPUT
          echo "[LOG] GHCR Org (lowercase): $GHCR_ORG_LOWER"

      - name: Generate build number
        id: generate-build-number
        run: |
          BUILD="$(date +"%Y%m%d.%H%M%S")"
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT
          echo "[LOG] Buildnumber: $BUILD"

  build-dev-images:
    name: Build ${{ matrix.node_label }} Node${{ matrix.node_version }} ${{ matrix.arch }} image
    needs: [create-build-number]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Recommended Node Version
          - node_version_var: RECOMMENDED_NODE_VERSION_DEV
            node_label: recommended
            platform: linux/amd64
            arch: amd64
          - node_version_var: RECOMMENDED_NODE_VERSION_DEV
            node_label: recommended
            platform: linux/arm64/v8
            arch: arm64v8
          # Experimental Node Version
          - node_version_var: EXPERIMENTAL_NODE_VERSION_DEV
            node_label: experimental
            platform: linux/amd64
            arch: amd64
          - node_version_var: EXPERIMENTAL_NODE_VERSION_DEV
            node_label: experimental
            platform: linux/arm64/v8
            arch: arm64v8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.1
        with:
          repository: '${{ vars.REPO_OWNER }}/${{ vars.REPO_NAME }}'
          ref: main

      - name: Set Node version
        id: set-node
        run: |
          if [ "${{ matrix.node_version_var }}" = "RECOMMENDED_NODE_VERSION_DEV" ]; then
            NODE_VERSION="${{ vars.RECOMMENDED_NODE_VERSION_DEV }}"
          else
            NODE_VERSION="${{ vars.EXPERIMENTAL_NODE_VERSION_DEV }}"
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "[LOG] Using Node.js version: $NODE_VERSION"

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          version-suffix: '-dev'
          node-version: ${{ steps.set-node.outputs.node_version }}
          build-number: ${{ needs.create-build-number.outputs.build_number }}
          ghcr-org: ${{ needs.create-build-number.outputs.ghcr_org }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64v8'
        uses: docker/setup-qemu-action@v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.PACKAGES_USER }}
          password: ${{ secrets.PACKAGES_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./debian13
          file: ./debian13/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_ORG_PRIMARY }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ needs.create-build-number.outputs.version }}-dev-build.${{ needs.create-build-number.outputs.build_number }}-${{ matrix.arch }}-node${{ steps.set-node.outputs.node_version }}
            ghcr.io/${{ needs.create-build-number.outputs.ghcr_org }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ needs.create-build-number.outputs.version }}-dev-build.${{ needs.create-build-number.outputs.build_number }}-${{ matrix.arch }}-node${{ steps.set-node.outputs.node_version }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}-node${{ steps.set-node.outputs.node_version }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}-node${{ steps.set-node.outputs.node_version }}

      - name: Build timing
        run: echo "[TIMING] Build ${{ matrix.node_label }} Node${{ steps.set-node.outputs.node_version }} ${{ matrix.arch }} completed"

  create-multiarch-images:
    name: Create multiarch manifests for Node${{ matrix.node_version }}
    runs-on: ubuntu-latest
    needs: [build-dev-images, create-build-number]
    strategy:
      matrix:
        include:
          - node_version_var: RECOMMENDED_NODE_VERSION_DEV
            node_label: recommended
          - node_version_var: EXPERIMENTAL_NODE_VERSION_DEV
            node_label: experimental
    steps:
      - name: Set Node version
        id: set-node
        run: |
          if [ "${{ matrix.node_version_var }}" = "RECOMMENDED_NODE_VERSION_DEV" ]; then
            NODE_VERSION="${{ vars.RECOMMENDED_NODE_VERSION_DEV }}"
          else
            NODE_VERSION="${{ vars.EXPERIMENTAL_NODE_VERSION_DEV }}"
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "[LOG] Creating manifests for Node.js version: $NODE_VERSION"

      - name: Login to DockerHub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.PACKAGES_USER }}
          password: ${{ secrets.PACKAGES_PASS }}

      - name: Create and push multi-platform manifests
        run: |
          START_TIME=$(date +%s)
          
          NODE_VERSION="${{ steps.set-node.outputs.node_version }}"
          VERSION="${{ needs.create-build-number.outputs.version }}"
          BUILD="${{ needs.create-build-number.outputs.build_number }}"
          
          # Define tags to create
          TAGS=(
            "dev-node${NODE_VERSION}"
            "${VERSION}-dev-node${NODE_VERSION}"
            "${VERSION}-dev-build.${BUILD}-node${NODE_VERSION}"
          )
          
          # Define registries
          REGISTRIES=(
            "${{ vars.DOCKERHUB_ORG_PRIMARY }}/${{ vars.DOCKER_IMAGE_NAME }}"
            "ghcr.io/${{ needs.create-build-number.outputs.ghcr_org }}/${{ vars.DOCKER_IMAGE_NAME }}"
          )
          
          # Source image tag
          BUILD_TAG="${VERSION}-dev-build.${BUILD}"
          
          # Create manifests for each tag and registry
          for TAG in "${TAGS[@]}"; do
            for REGISTRY in "${REGISTRIES[@]}"; do
              echo "[LOG] Creating manifest: ${REGISTRY}:${TAG}"
              docker buildx imagetools create \
                -t "${REGISTRY}:${TAG}" \
                "${REGISTRY}:${BUILD_TAG}-arm64v8-node${NODE_VERSION}" \
                "${REGISTRY}:${BUILD_TAG}-amd64-node${NODE_VERSION}"
            done
          done
          
          echo "[TIMING] Manifest creation for Node${NODE_VERSION}: $(($(date +%s) - START_TIME))s"
