# Github action to build Debian 13 image (Tag: latest)
name: Build Debian 13 Image (latest)

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  create-build-number:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false && !contains(github.event.release.tag_name, 'beta') && !contains(github.event.release.tag_name, 'rc'))
    name: Create build number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.generate-build-number.outputs.build_number }}
      release_tag: ${{ steps.set-release-tag.outputs.release_tag }}
      version: ${{ steps.read-version.outputs.version }}
      majorversion: ${{ steps.read-version.outputs.majorversion }}
      ghcr_org: ${{ steps.lowercase-ghcr.outputs.org }}
    steps:
      - name: Set release tag from event/manual input
        id: set-release-tag
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "[LOG] No release tag available." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "[LOG] Release tag from event/ref: $RELEASE_TAG"

      - name: Checkout repo (main for build number commit)
        uses: actions/checkout@v7.0.1
        with:
          repository: '${{ vars.REPO_OWNER }}/${{ vars.REPO_NAME }}'
          token: ${{ secrets.ACTIONS_PAT }}
          ref: main
          fetch-depth: 0

      - name: Generate build number
        id: generate-build-number
        run: |
          BUILD="$(date +"%Y%m%d.%H%M%S")"
          echo "$BUILD" > .github/dependencies/.latest-build
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT
          echo "[LOG] Buildnumber: $BUILD"

      - name: Commit latest release version
        run: |
          git config --global user.name '${{ vars.COMMIT_USER }}'
          git config --global user.email '${{ vars.COMMIT_EMAIL }}'
          git add .github/dependencies/.latest-build
          git commit -am "chore: Update build number to ${{ steps.generate-build-number.outputs.build_number }}" || true
          git push

      - name: Checkout repo (release tag for builds)
        uses: actions/checkout@v7.0.1
        with:
          repository: '${{ vars.REPO_OWNER }}/${{ vars.REPO_NAME }}'
          ref: ${{ steps.set-release-tag.outputs.release_tag }}

      - name: Read version and prepare outputs
        id: read-version
        run: |
          VERSION="$(cat .VERSION)"
          MAJORVERSION="latest-$(cat .VERSION | grep -oP '^v\d+')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "majorversion=$MAJORVERSION" >> $GITHUB_OUTPUT
          echo "[LOG] Version: $VERSION"
          echo "[LOG] Major Version: $MAJORVERSION"

      - name: Convert GHCR_ORG to lowercase
        id: lowercase-ghcr
        run: |
          GHCR_ORG_LOWER="$(echo '${{ vars.GHCR_ORG }}' | tr '[:upper:]' '[:lower:]')"
          echo "org=$GHCR_ORG_LOWER" >> $GITHUB_OUTPUT
          echo "[LOG] GHCR Org (lowercase): $GHCR_ORG_LOWER"

  build-and-publish-primary:
    name: Build and publish latest images (primary)
    needs: [create-build-number]
    uses: ./.github/workflows/_build-debian13-shared.yml
    with:
      track: latest
      version_suffix: ''
      checkout_ref: ${{ needs.create-build-number.outputs.release_tag }}
      node_version: ${{ vars.RECOMMENDED_NODE_VERSION }}
      build_number: ${{ needs.create-build-number.outputs.build_number }}
      version: ${{ needs.create-build-number.outputs.version }}
      ghcr_org: ${{ needs.create-build-number.outputs.ghcr_org }}
      dockerhub_org: ${{ vars.DOCKERHUB_ORG_PRIMARY }}
      manifest_tags_csv: latest,${{ needs.create-build-number.outputs.majorversion }},${{ needs.create-build-number.outputs.version }},${{ needs.create-build-number.outputs.version }}-build.${{ needs.create-build-number.outputs.build_number }}
      include_node_in_tags: false
      publish_ghcr: true
    secrets: inherit

  build-and-publish-secondary:
    name: Build and publish latest images (secondary)
    if: vars.ENABLE_SECONDARY_DEPLOYMENT == 'true'
    needs: [create-build-number]
    uses: ./.github/workflows/_build-debian13-shared.yml
    with:
      track: latest
      version_suffix: ''
      checkout_ref: ${{ needs.create-build-number.outputs.release_tag }}
      node_version: ${{ vars.RECOMMENDED_NODE_VERSION }}
      build_number: ${{ needs.create-build-number.outputs.build_number }}
      version: ${{ needs.create-build-number.outputs.version }}
      ghcr_org: ${{ needs.create-build-number.outputs.ghcr_org }}
      dockerhub_org: ${{ vars.DOCKERHUB_ORG_SECONDARY }}
      manifest_tags_csv: latest,${{ needs.create-build-number.outputs.majorversion }},${{ needs.create-build-number.outputs.version }},${{ needs.create-build-number.outputs.version }}-build.${{ needs.create-build-number.outputs.build_number }}
      include_node_in_tags: false
      publish_ghcr: false
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER_IOB }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS_IOB }}
      PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
      PACKAGES_PASS: ${{ secrets.PACKAGES_PASS }}
