# Reusable workflow: Docker image build + manifest creation for prerelease images
name: Build Debian 13 Image (shared)

on:
  workflow_call:
    inputs:
      track:
        description: 'Build track identifier (for example beta or latest)'
        required: true
        type: string
      version_suffix:
        description: 'Version suffix for prerelease builds (for example "-beta" or empty for latest)'
        required: true
        type: string
      checkout_ref:
        description: 'Git ref to check out for building'
        required: true
        type: string
      node_version:
        description: 'Primary recommended Node.js version'
        required: true
        type: string
      build_number:
        required: true
        type: string
      version:
        required: true
        type: string
      ghcr_org:
        description: 'GHCR organization name (must be lowercase)'
        required: true
        type: string
      dockerhub_org:
        description: 'DockerHub organization for image publishing (empty = primary org var)'
        required: false
        type: string
        default: ''
      manifest_tags_csv:
        description: 'Optional comma-separated manifest tags. Empty = auto tags by track/version'
        required: false
        type: string
        default: ''
      include_node_in_tags:
        description: 'Whether tags should contain node version suffixes'
        required: false
        type: boolean
        default: true
      publish_ghcr:
        description: 'Whether to also publish tags to GHCR'
        required: false
        type: boolean
        default: true
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true
      PACKAGES_USER:
        required: true
      PACKAGES_PASS:
        required: true

jobs:
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      manifest_matrix: ${{ steps.matrix.outputs.manifest_matrix }}
    steps:
      - name: Generate matrix from Node versions
        id: matrix
        run: |
          NODE="${{ inputs.node_version }}"
          BUILD_MATRIX='{"include":[{"node_version":"'"$NODE"'","node_label":"recommended","platform":"linux/amd64","arch":"amd64"},{"node_version":"'"$NODE"'","node_label":"recommended","platform":"linux/arm64/v8","arch":"arm64v8"}]}'
          MANIFEST_MATRIX='{"include":[{"node_version":"'"$NODE"'","node_label":"recommended"}]}'

          echo "build_matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT
          echo "manifest_matrix=$MANIFEST_MATRIX" >> $GITHUB_OUTPUT
          echo "[LOG] Build matrix: $BUILD_MATRIX"

  build-images:
    name: Build ${{ inputs.track }} image (${{ matrix.node_label }}, ${{ matrix.arch }})
    needs: [generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          repository: '${{ vars.REPO_OWNER }}/${{ vars.REPO_NAME }}'
          ref: ${{ inputs.checkout_ref }}

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          version-suffix: ${{ inputs.version_suffix }}
          node-version: ${{ matrix.node_version }}
          build-number: ${{ inputs.build_number }}
          ghcr-org: ${{ inputs.ghcr_org }}

      - name: Prepare image tags
        id: tag-config
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          SUFFIX="${{ inputs.version_suffix }}"
          BUILD="${{ inputs.build_number }}"
          ARCH="${{ matrix.arch }}"
          NODE_VERSION="${{ matrix.node_version }}"
          DOCKERHUB_ORG="${{ inputs.dockerhub_org }}"

          if [ -z "$DOCKERHUB_ORG" ]; then
            DOCKERHUB_ORG="${{ vars.DOCKERHUB_ORG_PRIMARY }}"
          fi

          if [ -n "$SUFFIX" ]; then
            BUILD_TAG="${VERSION}${SUFFIX}-build.${BUILD}"
          else
            BUILD_TAG="${VERSION}-build.${BUILD}"
          fi

          if [ "${{ inputs.include_node_in_tags }}" = "true" ]; then
            ARCH_TAG="${ARCH}-node${NODE_VERSION}"
          else
            ARCH_TAG="${ARCH}"
          fi

          TAGS="${DOCKERHUB_ORG}/${{ vars.DOCKER_IMAGE_NAME }}:${BUILD_TAG}-${ARCH_TAG}"

          if [ "${{ inputs.publish_ghcr }}" = "true" ]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/${{ inputs.ghcr_org }}/${{ vars.DOCKER_IMAGE_NAME }}:${BUILD_TAG}-${ARCH_TAG}"
          fi

          echo "build_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "arch_tag=${ARCH_TAG}" >> $GITHUB_OUTPUT
          echo "dockerhub_org=${DOCKERHUB_ORG}" >> $GITHUB_OUTPUT
          echo "image_tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: matrix.arch == 'arm64v8'
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Login to GitHub Container Registry
        if: inputs.publish_ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.PACKAGES_USER }}
          password: ${{ secrets.PACKAGES_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: ./debian13
          file: ./debian13/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            NODE=${{ matrix.node_version }}
            VERSION=${{ inputs.version }}
            DATI=${{ inputs.build_number }}
            BUILD=${{ inputs.build_number }}
          tags: ${{ steps.tag-config.outputs.image_tags }}
          cache-from: type=gha,scope=build-${{ inputs.track }}-${{ matrix.arch }}-node${{ matrix.node_version }}
          cache-to: type=gha,mode=max,scope=build-${{ inputs.track }}-${{ matrix.arch }}-node${{ matrix.node_version }}

      - name: Build timing
        run: echo "[TIMING] Build ${{ matrix.node_label }} Node${{ matrix.node_version }} ${{ matrix.arch }} completed"

  create-manifests:
    name: Create multiarch manifests (Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    needs: [build-images, generate-matrix]
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.manifest_matrix) }}
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Login to GitHub Container Registry
        if: inputs.publish_ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.PACKAGES_USER }}
          password: ${{ secrets.PACKAGES_PASS }}

      - name: Create and push multi-platform manifests
        run: |
          START_TIME=$(date +%s)

          NODE_VERSION="${{ matrix.node_version }}"
          VERSION="${{ inputs.version }}"
          SUFFIX="${{ inputs.version_suffix }}"
          BUILD="${{ inputs.build_number }}"
          TRACK="${{ inputs.track }}"
          MANIFEST_TAGS_CSV="${{ inputs.manifest_tags_csv }}"
          DOCKERHUB_ORG="${{ inputs.dockerhub_org }}"

          if [ -z "$DOCKERHUB_ORG" ]; then
            DOCKERHUB_ORG="${{ vars.DOCKERHUB_ORG_PRIMARY }}"
          fi

          if [ -n "$SUFFIX" ]; then
            BUILD_TAG="${VERSION}${SUFFIX}-build.${BUILD}"
          else
            BUILD_TAG="${VERSION}-build.${BUILD}"
          fi

          if [ "${{ inputs.include_node_in_tags }}" = "true" ]; then
            IMAGE_SUFFIX_ARM64="arm64v8-node${NODE_VERSION}"
            IMAGE_SUFFIX_AMD64="amd64-node${NODE_VERSION}"
          else
            IMAGE_SUFFIX_ARM64="arm64v8"
            IMAGE_SUFFIX_AMD64="amd64"
          fi

          if [ -n "$MANIFEST_TAGS_CSV" ]; then
            IFS=',' read -ra TAGS <<< "$MANIFEST_TAGS_CSV"
          elif [ "${{ inputs.include_node_in_tags }}" = "true" ]; then
            TAGS=(
              "${TRACK}-node${NODE_VERSION}"
              "${VERSION}${SUFFIX}-node${NODE_VERSION}"
              "${VERSION}${SUFFIX}-build.${BUILD}-node${NODE_VERSION}"
            )
          else
            TAGS=(
              "latest"
              "${VERSION}"
              "${VERSION}-build.${BUILD}"
            )
          fi

          REGISTRIES=("${DOCKERHUB_ORG}/${{ vars.DOCKER_IMAGE_NAME }}")
          if [ "${{ inputs.publish_ghcr }}" = "true" ]; then
            REGISTRIES+=("ghcr.io/${{ inputs.ghcr_org }}/${{ vars.DOCKER_IMAGE_NAME }}")
          fi

          for TAG in "${TAGS[@]}"; do
            for REGISTRY in "${REGISTRIES[@]}"; do
              echo "[LOG] Creating manifest: ${REGISTRY}:${TAG}"
              docker buildx imagetools create \
                -t "${REGISTRY}:${TAG}" \
                "${REGISTRY}:${BUILD_TAG}-${IMAGE_SUFFIX_ARM64}" \
                "${REGISTRY}:${BUILD_TAG}-${IMAGE_SUFFIX_AMD64}"
            done
          done

          echo "[TIMING] Manifest creation for Node${NODE_VERSION}: $(($(date +%s) - START_TIME))s"
