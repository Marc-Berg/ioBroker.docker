name: Version Checks

on:
  schedule:
    - cron: '42 23 * * *'
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.1
        with:
          repository: '${{ vars.GITHUB_REPO_OWNER }}/${{ vars.GITHUB_REPO_NAME }}'
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Docker baseimage check (Debian 13)
        id: baseimage-check-debian13
        uses: lucacome/docker-image-update-checker@v3.0.1
        with:
          base-image: debian:trixie-slim
          image: ${{ vars.DOCKERHUB_ORG_PRIMARY }}/${{ vars.DOCKER_IMAGE_NAME }}:debian13-latest

      - name: Fetch ioBroker and nodejs versions
        run: |
          curl -sL https://download.iobroker.net/sources-dist.json | \
          jq -r '."js-controller".version' > .github/dependencies/.js-controller-version
          echo "[LOG] Fetched js-controller version is $(cat .github/dependencies/.js-controller-version)"
          curl -sL https://download.iobroker.net/sources-dist.json | \
          jq -r '."admin".version' > .github/dependencies/.admin-version
          echo "[LOG] Fetched admin version is $(cat .github/dependencies/.admin-version)"
          curl -sL https://download.iobroker.net/sources-dist.json | \
          jq -r '."backitup".version' > .github/dependencies/.backitup-version
          echo "[LOG] Fetched backitup version is $(cat .github/dependencies/.backitup-version)"
          curl -sL https://download.iobroker.net/sources-dist.json | \
          jq -r '."discovery".version' > .github/dependencies/.discovery-version
          echo "[LOG] Fetched discovery version is $(cat .github/dependencies/.discovery-version)"
          curl -sL https://nodejs.org/dist/index.json | \
          jq -r 'map(select(.version | startswith("v24."))) | .[0].version' > .github/dependencies/.nodejs24-version
          echo "[LOG] Fetched nodejs v24 version is $(cat .github/dependencies/.nodejs24-version)"

      - name: Check for modified files
        id: git-check
        run: echo "modified=$([ -z "`git status --porcelain`" ] && echo "false" || echo "true")" >> $GITHUB_OUTPUT

      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name '${{ vars.GIT_COMMIT_USER }}'
          git config --global user.email '${{ vars.GIT_COMMIT_EMAIL }}'
          git commit -am "new ioBroker versions"
          git push

      - name: Logging result
        run: |
          echo "Debian 13 base image updated = ${{ steps.baseimage-check-debian13.outputs.needs-updating }}"
          echo "ioBroker version updated = ${{ steps.git-check.outputs.modified }}"

      - name: Trigger Build Debian 13 Image (latest)
        if: steps.baseimage-check-debian13.outputs.needs-updating == 'true' || steps.git-check.outputs.modified == 'true'
        uses: benc-uk/workflow-dispatch@v1.2
        with:
          ref: 'main'
          workflow: 'Build Debian 13 Image (latest)'
          repo: '${{ vars.GITHUB_REPO_OWNER }}/${{ vars.GITHUB_REPO_NAME }}'
          token: ${{ secrets.ACTIONS_PAT }}
