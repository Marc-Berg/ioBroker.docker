name: Update Docker Hub Readme
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/update-docker-readme.yml'
  workflow_dispatch:

jobs:
  update-docker-readme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Update Docker Hub Readme (primary image)
      uses: peter-evans/dockerhub-description@v5.0.0
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
        repository: ${{ vars.DOCKERHUB_ORG_PRIMARY }}/${{ vars.DOCKER_IMAGE_NAME }}
        short-description: ioBroker image (Trixie + Node.js 24). Fully compatible with the buanet/iobroker image.
        readme-filepath: ./docs/README_docker_hub_marcberg.md

    - name: Update Docker Hub Readme (ioBroker namespace)
      if: vars.ENABLE_SECONDARY_DEPLOYMENT == 'true'
      uses: peter-evans/dockerhub-description@v5.0.0
      with:
        username: ${{ secrets.DOCKER_USER_IOB }}
        password: ${{ secrets.DOCKER_PASS_IOB }}
        repository: ${{ vars.DOCKERHUB_ORG_SECONDARY }}/${{ vars.DOCKER_IMAGE_NAME }}
        short-description: ioBroker image (Trixie + Node.js 24). Fully compatible with the buanet/iobroker image.
        readme-filepath: ./docs/README_docker_hub_iobroker.md

